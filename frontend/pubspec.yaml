name: nith_alumni_connect
description: "NIT Hamirpur Alumni Connect mobile application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Networking & HTTP
  dio: ^5.8.0+1

  # Storage & Preferences
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4

  # UI & Media Utilities
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Annotations for code generation
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing & Mocking
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  freezed: ^2.5.7
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
